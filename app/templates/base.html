<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><link rel="stylesheet" href="/static/theme.css"><link rel="stylesheet" href="/static/layout.css"><link rel="stylesheet" href="/static/components.css"></head><body><div class="app"><aside class="rail"><div class="identity"><strong>LEASE</strong><span>软件资产席位台</span></div><nav>{% for module in modules %}<a href="/module/{{loop.index}}?run_id={{run.id}}" class="{{'picked' if active==loop.index else ''}}"><span>[{{loop.index}}]</span>{{module}}</a>{% endfor %}</nav><div class="rail-status"><i></i>本地核验<br>UTC · {{run.rule_version}}</div></aside><div class="work"><header class="topbar"><span class="breadcrumb">LICENSE / AUDIT</span><h1>{{modules[active-1]}}</h1><a class="btn" href="/api/export/{{run.id}}">导出证据</a></header><main class="content">{% block content %}{% endblock %}</main><footer class="statusbar"><span>{{run.id}} / v{{run.revision}}</span><span>{{run.created[:19]}} UTC</span><a href="/docs">API</a></footer></div></div><script src="/static/usage.js" defer></script><script src="/static/import.js" defer></script></body></html>
